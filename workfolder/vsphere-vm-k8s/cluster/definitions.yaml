            management: true
            use_dhcp: false
            ip: { get_input: worker4_ip }
            network: { get_input: network_cidr }
            gateway: { get_input: gateway }
      server:
        name: { get_input: worker4_vm_name }
        clone_vm: { get_input: source_vm_name }
        cpus: { get_input: vm_cpus }
        memory: { get_input: vm_memory_mb }
        add_scale_suffix: false
    interfaces:
      dell.interfaces.host:
        get_state: {}

  # ---------------------------------------------------------------------
  # OS preparation: hostname, swap, kernel settings, containerd, kubeadm
  # ---------------------------------------------------------------------

  master_prep:
    type: dell.nodes.Root
    interfaces:
      dell.interfaces.lifecycle:
        create:
          max_retries: 20
          retry_interval: 30
          implementation: fabric.fabric_plugin.tasks.run_script
          inputs:
            script_path: scripts/node_prepare.sh
            hide_output: [running]
            fabric_env:
              <<: *ssh_auth
              host_string: { get_input: master_ip }
            process:
              env:
                <<: *cluster_env
                NODE_NAME: { get_input: master_vm_name }
                NODE_IP: { get_input: master_ip }
        delete:
          implementation: fabric.fabric_plugin.tasks.run_script
          inputs:
            script_path: scripts/node_cleanup.sh
            hide_output: [running]
            fabric_env:
              <<: *ssh_auth
              host_string: { get_input: master_ip }
            process:
              env:
                <<: *cluster_env
                NODE_NAME: { get_input: master_vm_name }
                NODE_IP: { get_input: master_ip }
    relationships:
      - type: dell.relationships.depends_on
        target: master_vm

