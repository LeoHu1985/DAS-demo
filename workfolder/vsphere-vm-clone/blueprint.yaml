tosca_definitions_version: dell_1_1

description: >-
  Clone an existing virtual machine in vCenter to a new VM, placing the clone on a
  specific target datacenter, cluster, ESXi host, and datastore.

imports:
  - dell/types/types.yaml
  - plugin:vsphere-plugin?version= >=3.0.0.0,<4.0.0.0

labels:
  category:
    values:
      - infrastructure
  platform:
    values:
      - vsphere

blueprint_labels:
  vendor:
    values:
      - dell
  blueprint_type:
    values:
      - vm
  target:
    values:
      - vsphere

input_groups:
  connection:
    display_label: vCenter Connection
    collapsible: true
    index: 0
    inputs:
      - vsphere_secret_name
  source:
    display_label: Clone Source
    collapsible: true
    index: 1
    inputs:
      - source_vm_name
      - source_host_name
  target:
    display_label: Clone Target
    collapsible: true
    index: 2
    inputs:
      - target_vm_name
      - target_datacenter
      - target_cluster
      - target_host_name
      - target_datastore
      - resource_pool_name
      - power_on
  network:
    display_label: Network
    collapsible: true
    index: 3
    inputs:
      - network_name
      - switch_distributed
      - use_dhcp
      - static_ip
      - network_cidr
      - gateway

inputs:
  vsphere_secret_name:
    type: secret_key
    hidden: false
    allow_update: false
    display_label: vCenter Credentials
    description: Secret holding the vCenter login (host, port, username, password, allow_insecure, auto_placement, certificate_data).
    constraints:
      - type: vsphere
        error_message: "Select a secret of type vsphere containing the vCenter login"
    display:
      group: connection
      index: 0

  source_vm_name:
    type: string
    hidden: false
    allow_update: false
    display_label: Source VM Name
    description: Name of the existing VM in vCenter to clone.
    constraints:
      - pattern: ^(?!\s)(?!.*\s$).+$
        error_message: "Source VM name cannot be empty or have leading/trailing whitespace"
    display:
      group: source
      index: 0

  source_host_name:
    type: string
    hidden: false
    allow_update: false
    display_label: Source ESXi Host
    description: ESXi host currently running the source VM (recorded for traceability; vCenter locates the source VM by name).
    default: ""
    constraints:
      - pattern: ^$|^(?!\s)(?!.*\s$)[A-Za-z0-9.\-]+$
        error_message: "Host name may contain only letters, numbers, dots, and hyphens"
    display:
      group: source
      index: 1

  target_vm_name:
    type: string
    hidden: false
    allow_update: false
    display_label: Target VM Name
    description: Name for the new cloned VM. ASCII letters, numbers, and hyphens only.
    constraints:
      - pattern: ^(?!-)[a-zA-Z0-9-]{1,63}(?<!-)$
        error_message: "VM name must be 1-63 characters of letters, numbers, and hyphens, with no leading/trailing hyphen"
    display:
      group: target
      index: 0

  target_datacenter:
    type: string
    hidden: false
    allow_update: false
    display_label: Target Datacenter
    description: vCenter datacenter for the cloned VM.
    constraints:
      - pattern: ^(?!\s)(?!.*\s$).+$
        error_message: "Datacenter name cannot be empty or have leading/trailing whitespace"
    display:
      group: target
      index: 1

  target_cluster:
    type: string
    hidden: false
    allow_update: false
    display_label: Target Cluster
    description: vSphere cluster for the cloned VM.
    constraints:
      - pattern: ^(?!\s)(?!.*\s$).+$
        error_message: "Cluster name cannot be empty or have leading/trailing whitespace"
    display:
      group: target
      index: 2

  target_host_name:
    type: string
    hidden: false
    allow_update: false
    display_label: Target ESXi Host
    description: ESXi host (as named in vCenter) to place the cloned VM on.
    constraints:
      - pattern: ^(?!\s)(?!.*\s$)[A-Za-z0-9.\-]+$
        error_message: "Host name may contain only letters, numbers, dots, and hyphens"
    display:
      group: target
      index: 3

  target_datastore:
    type: string
    hidden: false
    allow_update: false
    display_label: Target Datastore
    description: Datastore to store the cloned VM's disks.
    constraints:
      - pattern: ^(?!\s)(?!.*\s$).+$
        error_message: "Datastore name cannot be empty or have leading/trailing whitespace"
    display:
      group: target
      index: 4

  resource_pool_name:
    type: string
    hidden: false
    allow_update: false
    display_label: Resource Pool
    description: Resource pool for the cloned VM. Use "Resources" for the cluster's root pool.
    default: Resources
    constraints:
      - pattern: ^(?!\s)(?!.*\s$).+$
        error_message: "Resource pool cannot be empty; use Resources for the root pool"
    display:
      group: target
      index: 5

  power_on:
    type: boolean
    hidden: false
    allow_update: false
    display_label: Power On After Clone
    description: Power on the cloned VM once it has been created.
    default: true
    display:
      group: target
      index: 6

  network_name:
    type: string
    hidden: false
    allow_update: true
    display_label: Port Group
    description: vSphere port group to attach the clone's network adapter to (e.g. VM Network). The plugin removes the source VM's adapters, so one must be defined here.
    default: VM Network
    constraints:
      - pattern: ^(?!\s)(?!.*\s$).+$
        error_message: "Port group name cannot be empty or have leading/trailing whitespace"
    display:
      group: network
      index: 0

  switch_distributed:
    type: boolean
    hidden: false
    allow_update: true
    display_label: Distributed Switch
    description: Set to true only if the port group is on a vSphere Distributed Switch.
    default: false
    display:
      group: network
      index: 1

  use_dhcp:
    type: boolean
    hidden: false
    allow_update: true
    display_label: Use DHCP
    description: Obtain the IP address via DHCP. Set to false to use the static IP fields below.
    default: true
    display:
      group: network
      index: 2

  static_ip:
    type: string
    hidden: false
    allow_update: true
    display_label: Static IP Address
    description: VM IP address when DHCP is off (e.g. 172.20.0.50). Leave empty for DHCP.
    default: ""
    constraints:
      - pattern: ^$|^((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.){3}(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)$
        error_message: "Must be a valid IPv4 address or empty"
    display:
      group: network
      index: 3

  network_cidr:
    type: string
    hidden: false
    allow_update: true
    display_label: Network CIDR
    description: Network block in CIDR notation when DHCP is off (e.g. 172.20.0.0/24) - not the VM's IP. Leave empty for DHCP.
    default: ""
    constraints:
      - pattern: ^$|^((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.){3}(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\/(3[0-2]|[12]?\d)$
        error_message: "Must be a valid CIDR block (e.g. 172.20.0.0/24) or empty"
    display:
      group: network
      index: 4

  gateway:
    type: string
    hidden: false
    allow_update: true
    display_label: Default Gateway
    description: Default gateway when DHCP is off (e.g. 172.20.0.1). Leave empty for DHCP.
    default: ""
    constraints:
      - pattern: ^$|^((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.){3}(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)$
        error_message: "Must be a valid IPv4 address or empty"
    display:
      group: network
      index: 5

dsl_definitions:
  connection_config: &connection_config
    username: { get_secret: [{ get_input: vsphere_secret_name }, username] }
    password: { get_secret: [{ get_input: vsphere_secret_name }, password] }
    host: { get_secret: [{ get_input: vsphere_secret_name }, host] }
    port: { get_secret: [{ get_input: vsphere_secret_name }, port] }
    datacenter_name: { get_input: target_datacenter }
    resource_pool_name: { get_input: resource_pool_name }
    auto_placement: { get_secret: [{ get_input: vsphere_secret_name }, auto_placement] }
    allow_insecure: { get_secret: [{ get_input: vsphere_secret_name }, allow_insecure] }
    certificate_data: { get_secret: [{ get_input: vsphere_secret_name }, certificate_data] }

node_templates:
  cloned_vm:
    type: dell.nodes.vsphere.Server
    properties:
      connection_config: *connection_config
      agent_config:
        install_method: none
      wait_ip: false
      enable_start_vm: { get_input: power_on }
      allowed_clusters:
        - { get_input: target_cluster }
      allowed_hosts:
        - { get_input: target_host_name }
      allowed_datastores:
        - { get_input: target_datastore }
      networking:
        connect_networks:
          - name: { get_input: network_name }
            switch_distributed: { get_input: switch_distributed }
            management: true
            use_dhcp: { get_input: use_dhcp }
            ip: { get_input: static_ip }
            network: { get_input: network_cidr }
            gateway: { get_input: gateway }
      server:
        name: { get_input: target_vm_name }
        clone_vm: { get_input: source_vm_name }
        add_scale_suffix: false
    interfaces:
      dell.interfaces.host:
        get_state: {}

capabilities:
  vm_name:
    description: Name of the cloned VM in vCenter
    value: { get_attribute: [cloned_vm, name] }

  vm_id:
    description: vSphere managed object ID of the cloned VM
    value: { get_attribute: [cloned_vm, vsphere_server_id] }

  vm_ip:
    description: IP address reported by the cloned VM (requires VMware Tools; may be empty)
    value: { get_attribute: [cloned_vm, ip] }

  esxi_host:
    description: ESXi host the cloned VM was placed on
    value: { get_attribute: [cloned_vm, hypervisor_hostname] }

  clone_source:
    description: Source VM and host the clone was taken from
    value: { concat: [{ get_input: source_vm_name }, "@", { get_input: source_host_name }] }
